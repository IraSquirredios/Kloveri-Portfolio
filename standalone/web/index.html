<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloveri — портфолио продуктов</title><link rel="stylesheet" href="style.css"><body><header><h1>✳ Cloveri Portfolio</h1><button id="logout" hidden>Выйти</button></header><p id="message" role="status"></p><main><section id="auth"><h2 id="auth-title">Вход</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="username" maxlength="254"></label><label>Пароль<input name="password" type="password" required minlength="8" maxlength="200" autocomplete="current-password"></label><button>Войти</button></form><button id="switch" class="secondary">Создать аккаунт</button><p>В новом аккаунте появятся три демонстрационных продукта. Все изменения сохраняются в базе.</p></section><section id="catalog" hidden><div class="toolbar"><h2>Мои продукты</h2><button id="add">Добавить продукт</button></div><div class="filters"><input id="search" type="search" placeholder="Поиск продуктов" aria-label="Поиск продуктов"><select id="category" aria-label="Категория"><option value="">Все категории</option></select></div><div id="cards"></div></section></main><dialog id="editor"><form id="edit"><h2>Продукт</h2><label>Название<input name="title" required maxlength="150"></label><label>Описание<textarea name="description" maxlength="5000" rows="5"></textarea></label><label>Категория<select name="category"><option value="it">IT</option><option value="education">Образование</option><option value="health">Здоровье</option></select></label><label>Стадия<select name="stage"><option value="idea">Идея</option><option value="mvp_development">Разработка MVP</option><option value="implementation">Реализация</option><option value="implemented">Реализован</option><option value="stopped">Остановлен</option></select></label><div class="actions"><button>Сохранить</button><button type="button" id="cancel" class="secondary">Отмена</button></div><p id="edit-error" role="alert"></p></form></dialog><script src="app.js"></script></body></html>
