server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_set_header Project-ID $http_project_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Account-ID $http_account_id;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_set_header Host platform.skroy.ru;
        proxy_set_header Project-ID $http_project_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Account-ID $http_account_id;
        proxy_pass https://platform.skroy.ru/;
    }
    location /directory-api/ {
        proxy_set_header Host directory.basis.skroy.ru;
        proxy_set_header Project-ID $http_project_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Account-ID $http_account_id;
        proxy_pass https://directory.basis.skroy.ru/;
    }
    location /auth-api/ {
        proxy_set_header Host api.users.skroy.ru;
        proxy_set_header Project-ID $http_project_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Account-ID $http_account_id;
        proxy_pass https://api.users.skroy.ru/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
